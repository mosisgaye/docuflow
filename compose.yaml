# Services du moteur de factures.
# Lancer la base : docker compose up -d base
name: moteur-factures

services:
  base:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factures
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: factures
    ports:
      # 5434 côté machine : 5432 est pris par le PostgreSQL système, 5433 par Unstract.
      - "127.0.0.1:5434:5432"
    volumes:
      - donnees_base:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factures -d factures"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  donnees_base:
