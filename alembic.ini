# Migrations du schéma de la base (Alembic).
#
#   uv run alembic upgrade head      appliquer toutes les migrations
#   uv run alembic current           voir où en est la base
#   uv run alembic revision -m "..." préparer une nouvelle migration
#
# L'adresse de la base n'est jamais écrite ici : elle vient de DATABASE_URL (fichier .env).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
