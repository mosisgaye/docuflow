[project]
name = "moteur-factures"
version = "0.1.0"
description = "Moteur de traitement de factures fournisseurs : lecture, extraction par LLM, contrôles."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "cryptography>=43",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "factur-x>=7.9",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
